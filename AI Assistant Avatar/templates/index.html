
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniel AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            background: white;
            max-width: 750px;
            margin: auto;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            color: #111827;
        }

        #status {
            color: #475569;
            margin: 15px;
        }

        #avatarContainer {
            width: 100%;
            max-width: 520px;
            margin: 20px auto;
            background: #111827;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        #avatarVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        button {
            padding: 12px 22px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #micButton {
            background: #16a34a;
        }

        #micButton:hover:not(:disabled) {
            background: #15803d;
        }

        #conversation {
            text-align: left;
            margin-top: 20px;
            padding: 18px;
            background: #f1f5f9;
            border-radius: 10px;
            min-height: 120px;
            max-height: 350px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .user {
            color: #1d4ed8;
        }

        .daniel {
            color: #15803d;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Daniel AI Assistant</h1>

    <p id="status">Status: Ready</p>

    <!-- AVATAR DISPLAY -->

    <div id="avatarContainer">

        <span id="avatarPlaceholder">
            Daniel's avatar will appear here
        </span>

        <video
            id="avatarVideo"
            autoplay
            playsinline>
        </video>

    </div>

    <!-- ASSISTANT CONTROLS -->

    <div>

        <button id="startButton">
            Start Assistant
        </button>

        <button id="stopButton" disabled>
            Stop Assistant
        </button>

    </div>

    <hr>

    <!-- VOICE CHAT -->

    <h3>Talk to Daniel</h3>

    <button id="micButton" disabled>
        Start Speaking
    </button>

    <!-- CONVERSATION -->

    <div id="conversation">
        Your conversation will appear here.
    </div>

</div>


<script type="module">

import {
    Room,
    RoomEvent,
    Track
} from "https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs";


let room = null;
let mediaRecorder = null;
let audioChunks = [];
let recording = false;
let assistantStarted = false;
let busy = false;


const status = document.getElementById("status");

const video = document.getElementById("avatarVideo");

const placeholder =
    document.getElementById("avatarPlaceholder");

const conversation =
    document.getElementById("conversation");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const micButton =
    document.getElementById("micButton");


function setStatus(message) {

    status.textContent = "Status: " + message;

}


// START ASSISTANT

async function startAssistant() {

    if (assistantStarted || busy) return;

    busy = true;
    startButton.disabled = true;

    setStatus("Starting Daniel...");

    try {

        const response = await fetch(
            "/api/create-session",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Session creation failed"
            );
        }

        if (!data.livekit_url ||
            !data.livekit_client_token) {

            throw new Error(
                "LiveKit connection details missing"
            );

        }

        room = new Room();

        room.on(
            RoomEvent.TrackSubscribed,
            (track, publication, participant) => {

                if (track.kind === Track.Kind.Video) {

                    track.attach(video);

                    video.style.display = "block";

                    placeholder.style.display = "none";

                    video.play().catch(console.error);

                }

                if (track.kind === Track.Kind.Audio) {

                    const audioElement = track.attach();

                    audioElement.autoplay = true;

                    document.body.appendChild(audioElement);

                }

            }
        );

        room.on(
            RoomEvent.TrackUnsubscribed,
            (track) => {

                track.detach();

            }
        );

        room.on(
            RoomEvent.Disconnected,
            () => {

                setStatus("Disconnected");

            }
        );


        setStatus("Connecting to avatar...");

        await room.connect(
            data.livekit_url,
            data.livekit_client_token
        );


        assistantStarted = true;

        stopButton.disabled = false;

        micButton.disabled = false;

        setStatus("Daniel connected successfully");


    } catch (error) {

        console.error("START ERROR:", error);

        setStatus("Error: " + error.message);

        if (room) {

            await room.disconnect();

            room = null;

        }

        assistantStarted = false;

        startButton.disabled = false;

    } finally {

        busy = false;

    }

}


// STOP ASSISTANT

async function stopAssistant() {

    if (busy) return;

    busy = true;

    setStatus("Stopping Daniel...");

    try {

        if (recording && mediaRecorder) {

            mediaRecorder.stop();

            recording = false;

        }

        if (room) {

            await room.disconnect();

            room = null;

        }

        const response = await fetch(
            "/api/stop-session",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.error || "Could not stop session"
            );

        }

        assistantStarted = false;

        video.srcObject = null;

        video.style.display = "none";

        placeholder.style.display = "block";

        startButton.disabled = false;

        stopButton.disabled = true;

        micButton.disabled = true;

        setStatus("Daniel stopped");


    } catch (error) {

        console.error("STOP ERROR:", error);

        setStatus("Stop error: " + error.message);

    } finally {

        busy = false;

    }

}


// RECORD VOICE

async function toggleRecording() {

    if (!assistantStarted || busy) {

        setStatus("Start Daniel first");

        return;

    }

    if (!recording) {

        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

            audioChunks = [];

            const mimeType =
                MediaRecorder.isTypeSupported(
                    "audio/webm;codecs=opus"
                )
                ? "audio/webm;codecs=opus"
                : "";

            mediaRecorder = new MediaRecorder(
                stream,
                mimeType ? { mimeType } : {}
            );


            mediaRecorder.ondataavailable = (event) => {

                if (event.data.size > 0) {

                    audioChunks.push(event.data);

                }

            };


            mediaRecorder.onstop = async () => {

                const audioBlob = new Blob(
                    audioChunks,
                    {
                        type: mediaRecorder.mimeType
                    }
                );

                stream.getTracks().forEach(
                    track => track.stop()
                );

                await sendAudio(audioBlob);

            };


            mediaRecorder.start();

            recording = true;

            micButton.textContent = "Stop Speaking";

            setStatus("Listening to you...");


        } catch (error) {

            console.error(error);

            setStatus(
                "Microphone error: " + error.message
            );

        }

    } else {

        mediaRecorder.stop();

        recording = false;

        micButton.textContent = "Start Speaking";

        setStatus("Processing your voice...");

    }

}


// SEND AUDIO TO GROQ

async function sendAudio(audioBlob) {

    const formData = new FormData();

    formData.append(
        "audio",
        audioBlob,
        "recording.webm"
    );

    setStatus("Understanding your voice...");

    try {

        const response = await fetch(
            "/api/voice-chat",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.error || "Voice processing failed"
            );

        }


        addMessage(
            "You",
            data.question,
            "user"
        );

        addMessage(
            "Daniel",
            data.answer,
            "daniel"
        );


        await speakResponse(data.answer);


    } catch (error) {

        console.error("VOICE ERROR:", error);

        setStatus(
            "Error: " + error.message
        );

    }

}


// GENERATE DANIEL'S VOICE

async function speakResponse(text) {

    setStatus("Generating Daniel's voice...");

    const response = await fetch(
        "/api/tts",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                text: text
            })
        }
    );

    if (!response.ok) {

        throw new Error("Speech generation failed");

    }

    const audioBlob = await response.blob();

    const audioUrl = URL.createObjectURL(audioBlob);

    const player = new Audio(audioUrl);

    player.onended = () => {

        URL.revokeObjectURL(audioUrl);

        setStatus("Ready for your next question");

    };

    player.onerror = () => {

        URL.revokeObjectURL(audioUrl);

        setStatus("Audio playback failed");

    };

    await player.play();

}


// DISPLAY CONVERSATION

function addMessage(name, message, className) {

    const element = document.createElement("div");

    element.className = "message";

    const label = document.createElement("strong");

    label.className = className;

    label.textContent = name + ": ";

    element.appendChild(label);

    element.appendChild(
        document.createTextNode(message)
    );

    conversation.appendChild(element);

    conversation.scrollTop =
        conversation.scrollHeight;

}


// BUTTON EVENT LISTENERS

startButton.addEventListener(
    "click",
    startAssistant
);

stopButton.addEventListener(
    "click",
    stopAssistant
);

micButton.addEventListener(
    "click",
    toggleRecording
);


</script>

</body>
</html>
